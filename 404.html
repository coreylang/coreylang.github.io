<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>404 — Struck by Lightning · Corey Lang</title>
    <meta name="description" content="This page wandered off into the storm." />
    <meta name="robots" content="noindex" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes gradientShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes flicker404 {
        0%, 100% { opacity: 1; }
        46%      { opacity: 0.35; }
        48%      { opacity: 1; }
        53%      { opacity: 0.7; }
        56%      { opacity: 1; }
      }
      @keyframes boltStrike {
        0%   { opacity: 0; filter: brightness(2) drop-shadow(0 0 18px #fff) drop-shadow(0 0 36px #facc15); }
        6%   { opacity: 1; }
        12%  { opacity: 0.2; }
        18%  { opacity: 1; }
        30%  { opacity: 0.9; filter: brightness(1.4) drop-shadow(0 0 14px #fff) drop-shadow(0 0 28px #facc15); }
        70%  { opacity: 0.55; filter: brightness(1.1) drop-shadow(0 0 10px #facc15); }
        100% { opacity: 0; filter: brightness(1) drop-shadow(0 0 4px #facc15); }
      }
      @keyframes screenFlash {
        0%   { opacity: 0; }
        10%  { opacity: 0.7; }
        20%  { opacity: 0.1; }
        30%  { opacity: 0.5; }
        100% { opacity: 0; }
      }
      body {
        background: linear-gradient(135deg, #0c1929, #1e1b4b, #6b21a8, #1e3a8a);
        background-size: 400% 400%;
        animation: gradientShift 16s ease infinite;
        min-height: 100vh;
        overflow: hidden;
      }
      .glitched-404 {
        font-size: clamp(7rem, 22vw, 15rem);
        font-weight: 900;
        line-height: 0.95;
        background: linear-gradient(135deg, #facc15 0%, #ffffff 45%, #a78bfa 100%);
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
        animation: flicker404 3.4s ease-in-out infinite;
        letter-spacing: -0.05em;
        text-shadow: 0 0 60px rgba(250, 204, 21, 0.18);
      }
      .bolt-bg {
        position: absolute;
        top: 0;
        height: 100vh;
        pointer-events: none;
        animation: boltStrike 0.9s ease-out forwards;
      }
      .flash-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(255,255,240,0.85) 0%, rgba(255,236,160,0.55) 30%, rgba(255,255,255,0) 75%);
        animation: screenFlash 0.9s ease-out forwards;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      .home-btn:hover {
        box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.25), 0 0 30px rgba(250, 204, 21, 0.55);
      }
    </style>
  </head>
  <body class="text-white antialiased relative font-sans">
    <div id="bolt-stage" class="fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>
    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 text-center">
      <h1 class="glitched-404">404</h1>
      <p class="text-2xl md:text-3xl font-bold mt-4 tracking-tight">
        Struck by lightning <span aria-hidden="true">⚡</span>
      </p>
      <p class="text-base md:text-lg text-gray-300 mt-3 max-w-md">
        This page wandered off into the storm and didn't make it home.
      </p>
      <a href="/" class="home-btn mt-9 inline-flex items-center gap-2 px-6 py-3 rounded-full bg-white text-gray-900 font-semibold transition-shadow shadow-lg">
        <span aria-hidden="true">←</span> Back to safety
      </a>
      <p class="text-xs text-gray-400 mt-10">
        coreylang.github.io
      </p>
    </main>
    <script>
      function generateBoltBranches() {
        const segments = 6 + Math.floor(Math.random() * 4);
        const w = 220, h = 1000;
        const main = [[w / 2, 0]];
        const forks = [];
        for (let i = 1; i <= segments; i++) {
          const ny = (h / segments) * i;
          const nx = w / 2 + (Math.random() - 0.5) * w * 0.85;
          main.push([nx, ny]);
          if (Math.random() < 0.45 && i < segments) {
            const bx = nx + (Math.random() - 0.5) * w * 0.7;
            const by = ny + (h / segments) * (0.4 + Math.random() * 0.5);
            const fork = [[nx, ny], [bx, by]];
            if (Math.random() < 0.55) {
              const bx2 = bx + (Math.random() - 0.5) * w * 0.4;
              const by2 = by + (h / segments) * (0.3 + Math.random() * 0.4);
              fork.push([bx2, by2]);
            }
            forks.push(fork);
          }
        }
        return [main, ...forks];
      }

      function polygonForBranch(points, startWidth) {
        const n = points.length;
        if (n < 2) return '';
        const widths = points.map((_, i) => startWidth * (1 - i / (n - 1)));
        const perps = [];
        for (let i = 0; i < n; i++) {
          let dx, dy;
          if (i === 0)          { dx = points[1][0] - points[0][0];     dy = points[1][1] - points[0][1]; }
          else if (i === n - 1) { dx = points[i][0] - points[i-1][0];   dy = points[i][1] - points[i-1][1]; }
          else                  { dx = points[i+1][0] - points[i-1][0]; dy = points[i+1][1] - points[i-1][1]; }
          const len = Math.hypot(dx, dy) || 1;
          perps.push([-dy / len, dx / len]);
        }
        let d = '';
        for (let i = 0; i < n - 1; i++) {
          const half = widths[i] / 2;
          const px = points[i][0] + perps[i][0] * half;
          const py = points[i][1] + perps[i][1] * half;
          d += (i === 0 ? 'M ' : 'L ') + px.toFixed(2) + ' ' + py.toFixed(2) + ' ';
        }
        d += 'L ' + points[n-1][0].toFixed(2) + ' ' + points[n-1][1].toFixed(2) + ' ';
        for (let i = n - 2; i >= 0; i--) {
          const half = widths[i] / 2;
          const px = points[i][0] - perps[i][0] * half;
          const py = points[i][1] - perps[i][1] * half;
          d += 'L ' + px.toFixed(2) + ' ' + py.toFixed(2) + ' ';
        }
        d += 'Z';
        return d;
      }

      function spawnBolt() {
        const stage = document.getElementById('bolt-stage');
        if (!stage) return;

        const flash = document.createElement('div');
        flash.className = 'flash-bg';
        stage.appendChild(flash);

        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('class', 'bolt-bg');
        svg.setAttribute('viewBox', '0 0 220 1000');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        svg.style.left = Math.random() * Math.max(0, window.innerWidth - 220) + 'px';

        const branches = generateBoltBranches();
        branches.forEach((branch, idx) => {
          const isMain = idx === 0;
          const glow = document.createElementNS(svgNS, 'path');
          glow.setAttribute('d', polygonForBranch(branch, isMain ? 24 : 12));
          glow.setAttribute('fill', '#facc15');
          glow.setAttribute('opacity', '0.5');

          const core = document.createElementNS(svgNS, 'path');
          core.setAttribute('d', polygonForBranch(branch, isMain ? 7 : 3.5));
          core.setAttribute('fill', '#ffffff');

          svg.appendChild(glow);
          svg.appendChild(core);
        });
        stage.appendChild(svg);

        setTimeout(() => { flash.remove(); svg.remove(); }, 950);
      }

      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduced) {
        setTimeout(spawnBolt, 250);
        setInterval(() => { if (Math.random() < 0.45) spawnBolt(); }, 1400);
      }
    </script>
  </body>
</html>
